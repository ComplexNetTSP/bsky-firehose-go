# This workflow will build and push a Docker image to GitHub Container Registry (GHCR) on pushes to the main branch or when a tag is pushed.

name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Use the tag name if this is a tag push
            ${{ github.ref_type == 'tag' && format('{0}', github.ref_name) || '' }}


      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: ./Dockerfile

      - name: Update 'latest' tag for main branch
        if: github.ref == 'refs/heads/main'
        run: |
          LATEST_TAG=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags" | \
            jq -r '.[] | select(.ref | test("^refs/tags/v")) | .ref' | \
            sort -Vr | head -n 1 | sed 's|refs/tags/||')

          if [ -n "$LATEST_TAG" ]; then
            echo "Latest tag is: $LATEST_TAG"
            docker buildx imagetools create \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$LATEST_TAG
            echo "Updated 'latest' tag to point to $LATEST_TAG"
          else
            echo "No version tags found to update 'latest'"
          fi


      - name: Release Docker Image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Docker image pushed with tag: ${{ steps.meta.outputs.tags }}"
          echo "You can now find the image at: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
