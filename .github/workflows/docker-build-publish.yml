# This workflow will build and push a Docker image to GitHub Container Registry (GHCR) on pushes to the main branch or when a tag is pushed.

name: Build and Push Docker Image

on:
  push:
    tags: [ "v*" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set lowercase image name
        run: |
          REPO_NAME="${{ github.repository }}"
          ORG_NAME=$(echo "$REPO_NAME" | cut -d'/' -f1)
          REPO_NAME=$(echo "$REPO_NAME" | cut -d'/' -f2)
          LOWERCASE_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$ORG_NAME/$LOWERCASE_REPO_NAME" >> $GITHUB_ENV


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            ${{ github.ref_type == 'tag' && github.ref_name || '' }}
            ${{ github.ref == 'refs/heads/main' && 'latest' || '' }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: ./Dockerfile

      - name: Update 'latest' tag to point to the latest version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Fetch all version tags
          VERSION_TAGS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags" | \
            jq -r '.[] | select(.ref | test("^refs/tags/v")) | .ref' | \
            sed 's|refs/tags/||')

          # Get the latest version tag
          LATEST_VERSION_TAG=$(echo "$VERSION_TAGS" | sort -Vr | head -n 1)

          if [ "$LATEST_VERSION_TAG" != "${{ github.ref_name }}" ]; then
            echo "Updating 'latest' tag to point to the latest version tag: $LATEST_VERSION_TAG"
            docker buildx imagetools create \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$LATEST_VERSION_TAG
          else
            echo "'latest' tag already points to the latest version tag: $LATEST_VERSION_TAG"
          fi

      - name: Release Docker Image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Docker image pushed with tag: ${{ steps.meta.outputs.tags }}"
          echo "You can find the image at: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
