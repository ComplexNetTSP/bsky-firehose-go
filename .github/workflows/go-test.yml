# This workflow will test the Go code on push events

name: Go Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Run Go vet
      run: go vet ./...

    - name: Run Go tests
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
